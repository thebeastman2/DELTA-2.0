  <script>
    /* DELTA gate guard (runs before the app bundle): the landing page is the
     * front door - fresh visits start there, and the workspace (/dashboard)
     * is only reachable through the login page. Only an in-tab reload of an
     * already-active session may continue silently. Redirects happen here,
     * before the app loads, so page changes never flash the wrong screen. */
    (function () {
      try {
        var nav = (performance.getEntriesByType("navigation")[0] || {}).type || "navigate";
        /* landing-first: a cold arrival at the login page (bookmark,
         * address-bar autocomplete, restored tab, external link) goes to the
         * landing page. In-site clicks are stamped from=hero at click time
         * and the email flow carries mode= - both reach the login directly.
         * (Never trust document.referrer here: service workers and privacy
         * settings can blank it, which bounced real clicks to the hero.) */
        if (location.pathname.indexOf("/auth") === 0) {
          /* kill any leftover app session BEFORE the bundle restores it -
           * otherwise the app auto-navigates to /dashboard and bounces the
           * user back to the landing page (fails first try, works second) */
          var ai, ak, aks = [];
          for (ai = 0; ai < localStorage.length; ai++) aks.push(localStorage.key(ai));
          for (ai = 0; ai < aks.length; ai++) {
            ak = aks[ai];
            if (/^__convexAuth(JWT|RefreshToken)_/.test(ak)) localStorage.removeItem(ak);
          }
          try { localStorage.removeItem("delta.guestMode"); } catch (e) {}
          if (nav === "navigate" &&
              location.search.indexOf("from=hero") === -1 &&
              location.search.indexOf("mode=") === -1) location.replace("/");
          return;
        }
        if (location.pathname.indexOf("/dashboard") !== 0) return;
        if (nav === "reload") return;
        try {
          var et = parseInt(sessionStorage.getItem("delta.entered"), 10);
          if (et > 0 && (Date.now() - et) < 30000) return; /* explicit entry just happened */
        } catch (e) {}
        var i, k, ks = [];
        for (i = 0; i < localStorage.length; i++) ks.push(localStorage.key(i));
        for (i = 0; i < ks.length; i++) {
          k = ks[i];
          if (/^__convexAuth(JWT|RefreshToken)_/.test(k)) localStorage.removeItem(k);
        }
        try { localStorage.removeItem("delta.guestMode"); } catch (e) {}
        /* bounce before the app bundle loads - no flash of the workspace */
        location.replace("/");
      } catch (e) {}
    })();
  </script>

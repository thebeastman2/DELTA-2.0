  <script>
    /* DELTA gate guard (runs before the app bundle): every FRESH page load
     * starts clean - no leftover session may be restored, or the app's own
     * auth page auto-navigates to the workspace and the gate bounces the
     * user back to the hero. Only an in-tab reload (and the 30s handoff
     * window right after an explicit entry) keeps its session. Landing-first
     * redirects happen here, before the app loads. */
    (function () {
      try {
        /* /auth hosts our own gate; the app bundle ships a built-in login
         * page there too - keep it from painting underneath the gate */
        if (location.pathname.indexOf("/auth") === 0) {
          var st = document.createElement("style");
          st.id = "dg-hide-root";
          st.textContent = "#root{display:none !important}body{background:#060b13}";
          (document.head || document.documentElement).appendChild(st);
        }
        var nav = (performance.getEntriesByType("navigation")[0] || {}).type || "navigate";
        var p = location.pathname;
        if (nav === "reload") return; /* F5: the current page hands off as-is */
        if (p.indexOf("/dashboard") === 0) {
          try {
            var et = parseInt(sessionStorage.getItem("delta.entered"), 10);
            if (et > 0 && (Date.now() - et) < 30000) return; /* explicit entry just happened */
          } catch (e) {}
        }
        var i, k, ks = [];
        for (i = 0; i < localStorage.length; i++) ks.push(localStorage.key(i));
        for (i = 0; i < ks.length; i++) {
          k = ks[i];
          if (/^__convexAuth(JWT|RefreshToken)_/.test(k)) localStorage.removeItem(k);
        }
        try { localStorage.removeItem("delta.guestMode"); } catch (e) {}
        /* landing-first: cold login hits and direct workspace hits start at
         * the hero; in-site clicks carry from=hero and email links mode= */
        if (nav === "navigate") {
          if (p.indexOf("/auth") === 0 &&
              location.search.indexOf("from=hero") === -1 &&
              location.search.indexOf("mode=") === -1) { location.replace("/"); return; }
          if (p.indexOf("/dashboard") === 0) { location.replace("/"); return; }
        }
      } catch (e) {}
    })();
  </script>
